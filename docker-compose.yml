version: "3.8"

# Private Multi-Root CA — deploy via Portainer Stack
# Services: ca-ui (FastAPI, macht alle CA-Operationen via openssl) + renewer (Scheduler)

services:

  ui:
    image: ghcr.io/michik1712/ca-manager-ui:latest
    container_name: ca-ui
    restart: unless-stopped
    environment:
      # OIDC (Authentik)
      OIDC_ISSUER: ${OIDC_ISSUER:-https://idp.mkubalek.eu/application/o/ca-manager/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://ca.kubalek.local/oidc/callback}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
      # CA
      CA_DATA_DIR: /var/lib/ca
      # SMTP (extern)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TO: ${SMTP_TO}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      # Misc
      SECRET_KEY: ${SECRET_KEY}
      CA_KEY_PASSPHRASE: ${CA_KEY_PASSPHRASE}
    volumes:
      - ca_data:/var/lib/ca
    ports:
      - "${UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  renewer:
    image: ghcr.io/michik1712/ca-manager-ui:latest
    container_name: ca-renewer
    restart: unless-stopped
    depends_on:
      ui:
        condition: service_healthy
    command: ["python", "-m", "backend.renewer"]
    environment:
      CA_DATA_DIR: /var/lib/ca
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TO: ${SMTP_TO}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      RENEW_ENABLED: ${RENEW_ENABLED:-true}
      RENEW_DAYS_BEFORE: ${RENEW_DAYS_BEFORE:-30}
    volumes:
      - ca_data:/var/lib/ca

volumes:
  ca_data:
