<div class="inline-form">
  <h3>Neue Root-CA erstellen</h3>
  <form hx-post="/api/roots" hx-target="#dash-body" hx-swap="innerHTML" class="form-grid">
    <label>Name
      <input name="name" placeholder="Home Root" required>
    </label>
    <label>Organisation
      <input name="org" value="MK">
    </label>
    <label>Gültigkeit (Jahre)
      <input name="days" type="number" value="3650">
    </label>
    <label>Schlüsseltyp
      <select name="key_type">
        <option value="rsa">RSA (4096)</option>
        <option value="ecdsa">ECDSA (P-256)</option>
      </select>
    </label>
    <button class="btn" type="submit">Erstellen</button>
  </form>
</div>

<div class="inline-form">
  <h3>Externe Root-CA importieren</h3>
  <p class="muted">Ein bestehendes Zertifikat (PEM) als Root einspielen. Ohne privaten Key nur als Vertrauensanker (Ansicht/Download), mit Key auch zum Signieren.</p>
  <form hx-post="/api/roots/import" hx-target="#dash-body" hx-swap="innerHTML" class="form-grid">
    <label>Name
      <input name="name" placeholder="Meine CA (leer = aus Cert übernehmen)">
    </label>
    <label>Zertifikat (PEM)
      <textarea name="cert_pem" rows="5" placeholder="-----BEGIN CERTIFICATE-----" required></textarea>
    </label>
    <label>Privater Key (PEM, optional)
      <textarea name="key_pem" rows="5" placeholder="-----BEGIN PRIVATE KEY-----"></textarea>
    </label>
    <button class="btn" type="submit">Importieren</button>
  </form>
</div>
